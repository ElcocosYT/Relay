<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    La papelera de los botones de borrar de las fichas.

    Se usa como mascara -se recorta el color del boton con ella-, asi que
    aqui solo importa la silueta: el relleno negro es lo opaco.

    Bajada 10,5 para que quede en el centro del lienzo: dibujada desde
    arriba (de 0 a 491), salia medio pixel por encima del centro del boton.
  -->
  <g fill="#000" transform="translate(0 10.5)">
    <rect x="136" y="0" width="240" height="62" rx="26"/>
    <rect x="34" y="38" width="444" height="66" rx="24"/>
    <path d="M66 146h380v276c0 38-31 69-69 69H135c-38 0-69-31-69-69z"/>
  </g>
</svg>
