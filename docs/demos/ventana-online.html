<script>
/* En la web, la rueda mueve la pagina, no lo de dentro de la demo: si no,
   al bajar por la web se quedaba uno atascado en una lista.

   Sin interceptar la rueda: antes se pasaba a mano con scrollBy, y con el
   desplazamiento suave de la pagina cada muesca reiniciaba el viaje desde
   donde iba -la pagina bajaba a tirones, como queriendo volver-. Ahora las
   listas de dentro no se desplazan con la rueda (overflow hidden: siguen
   pudiendo moverse por guion), asi que el navegador pasa la rueda a la
   pagina el solo, igual de suave que en el resto. */
if (top !== window) {
  for (const el of document.querySelectorAll("*")) {
    const cs = getComputedStyle(el);
    if (/(auto|scroll)/.test(cs.overflowY + cs.overflowX)) { el.style.setProperty("overflow", "hidden", "important"); }
  }
}
</script>
<script>
/* Pulsar una pantalla en la barra lateral se lo dice a la web, que pasa a
   ese paso del recorrido. */
(() => {
  const rail = document.getElementById("rail");
  if (!rail) { return; }
  const oir = () => {
    try {
      rail.contentDocument.addEventListener("click", (ev) => {
        const f = ev.target.closest && ev.target.closest('[data-act="navigate"]');
        if (f) { parent.postMessage({ relayVista: f.dataset.id || (f.textContent || "").trim().toLowerCase() }, "*"); }
      });
    } catch (e) { }
  };
  rail.addEventListener("load", oir);
  if (rail.contentDocument && rail.contentDocument.readyState === "complete" && rail.contentDocument.body.childElementCount) { oir(); }
})();
</script>
