<script>
/* En la web, la rueda mueve la pagina, no lo de dentro de la demo: si no,
   al bajar por la web se quedaba uno atascado en una lista. */
addEventListener("wheel", (e) => {
  if (top !== window) { e.preventDefault(); try { top.scrollBy(0, e.deltaY); } catch (x) { } }
}, { passive: false });
</script>
<script>
/* Las vistas de la ventana, como en la aplicacion: pulsar en la barra
   lateral cambia la pantalla y enciende su fila. */
(() => {
  const VISTAS = ["library","albums","artists","online","mixer","themes"];
  const rail = document.getElementById("rail");
  const poner = (v) => {
    if (!VISTAS.includes(v)) { return; }
    document.body.dataset.vista = v;
    rail.src = "rail-" + v + ".html";
    parent.postMessage({ relayVista: v }, "*");
  };
  window.relayVista = poner;
  addEventListener("message", (e) => { if (e.data && e.data.relayVista) { if (document.body.dataset.vista !== e.data.relayVista) { poner(e.data.relayVista); } } });
  rail.addEventListener("load", () => {
    rail.contentDocument.addEventListener("click", (ev) => {
      const fila = ev.target.closest && ev.target.closest('[data-act="navigate"]');
      if (fila) { poner(fila.dataset.id || (fila.textContent || "").trim().toLowerCase()); }
    });
  });
})();
</script>
